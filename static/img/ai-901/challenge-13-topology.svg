<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 13 face detection results</title>
  <desc id="desc">Diagram showing an image with two detected faces and the result objects returned for each face, including bounding boxes, landmarks, head pose, and other attributes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .desc { font: 10px 'Segoe UI', Arial, sans-serif; fill: #333333; }
      .line { stroke: #666666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <text x="24" y="24" class="title">Challenge 13 — face detection results</text>

  <rect x="20" y="52" width="200" height="220" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="120" y="75" text-anchor="middle" class="label">Source image</text>
  <rect x="48" y="102" width="60" height="84" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  <circle cx="78" cy="130" r="16" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <circle cx="72" cy="126" r="2.5" fill="#666666"/>
  <circle cx="84" cy="126" r="2.5" fill="#666666"/>
  <path d="M70 138 Q78 145 86 138" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="78" y="202" text-anchor="middle" class="desc">Face 1 box</text>

  <rect x="132" y="112" width="54" height="76" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  <circle cx="159" cy="138" r="14" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <circle cx="154" cy="135" r="2.2" fill="#666666"/>
  <circle cx="164" cy="135" r="2.2" fill="#666666"/>
  <path d="M152 146 Q159 151 166 146" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="159" y="204" text-anchor="middle" class="desc">Face 2 box</text>
  <text x="120" y="236" text-anchor="middle" class="desc">Bounding boxes locate each detected face in the image</text>

  <path d="M220 144 H265" class="line"/>

  <rect x="265" y="40" width="390" height="232" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="460" y="64" text-anchor="middle" class="label">Detection results</text>

  <rect x="286" y="82" width="348" height="100" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="306" y="104" class="label">Face 1</text>
  <text x="306" y="122" class="desc">• Bounding box: left, top, width, height</text>
  <text x="306" y="138" class="desc">• Face landmarks: pupils, nose tip, mouth corners</text>
  <text x="306" y="154" class="desc">• Head pose: roll, yaw, pitch</text>
  <text x="306" y="170" class="desc">• Accessories, blur, occlusion</text>

  <rect x="286" y="194" width="348" height="56" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="306" y="217" class="label">Face 2</text>
  <text x="306" y="235" class="desc">• Another face object with its own bounding box and attributes</text>
  <text x="306" y="249" class="desc">• Detection finds faces, but does not identify who the person is</text>
</svg>