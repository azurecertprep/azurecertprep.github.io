<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 11 image analysis pipeline</title>
  <desc id="desc">Pipeline showing an input image sent to Azure AI Vision for image analysis and returning tags, objects, OCR text, and a caption.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .desc { font: 10px 'Segoe UI', Arial, sans-serif; fill: #333333; }
      .line { stroke: #666666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <text x="24" y="24" class="title">Challenge 11 — image analysis pipeline</text>

  <rect x="20" y="58" width="130" height="110" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="85" y="80" text-anchor="middle" class="label">Input image</text>
  <rect x="40" y="95" width="90" height="52" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
  <path d="M50 140 L72 120 L88 132 L106 108 L120 140" fill="none" stroke="#6c8ebf" stroke-width="2"/>
  <circle cx="63" cy="108" r="5" fill="#d6b656"/>
  <text x="85" y="158" text-anchor="middle" class="desc">Photo or frame to analyze</text>

  <path d="M150 113 H215" class="line"/>

  <rect x="215" y="76" width="170" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="300" y="101" text-anchor="middle" class="label">Azure AI Vision</text>
  <text x="300" y="118" text-anchor="middle" class="desc">Analyze Image API</text>
  <text x="300" y="134" text-anchor="middle" class="desc">Runs multiple detectors in one call</text>

  <path d="M385 113 H430" class="line"/>

  <rect x="430" y="36" width="210" height="154" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="535" y="58" text-anchor="middle" class="label">Features extracted</text>

  <rect x="448" y="72" width="84" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="490" y="96" text-anchor="middle" class="label">Tags</text>
  <rect x="538" y="72" width="84" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="580" y="96" text-anchor="middle" class="label">Objects</text>
  <rect x="448" y="122" width="84" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="490" y="146" text-anchor="middle" class="label">OCR text</text>
  <rect x="538" y="122" width="84" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="580" y="146" text-anchor="middle" class="label">Caption</text>
  <text x="535" y="178" text-anchor="middle" class="desc">Confidence scores and bounding boxes included</text>
</svg>