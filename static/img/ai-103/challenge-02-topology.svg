<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="650" height="400" fill="#f9fafb" rx="8"/>
  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Multi-Service vs Single-Service Resources</text>
  <!-- VS divider -->
  <line x1="325" y1="45" x2="325" y2="380" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,5"/>
  <rect x="305" y="180" width="40" height="30" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="325" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">VS</text>
  <!-- LEFT: Multi-Service -->
  <text x="162" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c8ebf">Multi-Service Resource</text>
  <!-- Single endpoint box -->
  <rect x="30" y="70" width="270" height="280" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="165" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Azure AI Services (Multi)</text>
  <text x="165" y="107" text-anchor="middle" font-size="10" fill="#555">Single Endpoint &amp; Key</text>
  <!-- Capabilities within -->
  <rect x="50" y="118" width="110" height="38" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="0.8"/>
  <text x="105" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Vision</text>
  <text x="105" y="148" text-anchor="middle" font-size="8" fill="#555">Image Analysis</text>
  <rect x="170" y="118" width="110" height="38" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="0.8"/>
  <text x="225" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Language</text>
  <text x="225" y="148" text-anchor="middle" font-size="8" fill="#555">Text Analytics</text>
  <rect x="50" y="164" width="110" height="38" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="0.8"/>
  <text x="105" y="181" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Speech</text>
  <text x="105" y="194" text-anchor="middle" font-size="8" fill="#555">STT / TTS</text>
  <rect x="170" y="164" width="110" height="38" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="0.8"/>
  <text x="225" y="181" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Translator</text>
  <text x="225" y="194" text-anchor="middle" font-size="8" fill="#555">Multi-language</text>
  <!-- Pros -->
  <rect x="45" y="215" width="240" height="125" rx="6" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="165" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#82b366">✓ Advantages</text>
  <text x="60" y="250" font-size="9" fill="#333">• One endpoint for all services</text>
  <text x="60" y="265" font-size="9" fill="#333">• Single key to manage</text>
  <text x="60" y="280" font-size="9" fill="#333">• Simplified billing</text>
  <text x="60" y="295" font-size="9" fill="#333">• Easier to provision</text>
  <text x="60" y="310" font-size="9" fill="#333">• Good for multi-service apps</text>
  <text x="60" y="325" font-size="9" fill="#555">⚠ Shared rate limits</text>
  <!-- RIGHT: Single-Service -->
  <text x="487" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#9673a6">Single-Service Resources</text>
  <!-- Multiple endpoint boxes -->
  <rect x="355" y="70" width="270" height="280" rx="8" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="490" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Dedicated Resources</text>
  <text x="490" y="107" text-anchor="middle" font-size="10" fill="#555">Separate Endpoints &amp; Keys</text>
  <!-- Individual services -->
  <rect x="370" y="118" width="115" height="38" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="0.8"/>
  <text x="427" y="133" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Vision Resource</text>
  <text x="427" y="148" text-anchor="middle" font-size="8" fill="#555">endpoint-1.cognitiveservices</text>
  <rect x="495" y="118" width="115" height="38" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="0.8"/>
  <text x="552" y="133" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Language Resource</text>
  <text x="552" y="148" text-anchor="middle" font-size="8" fill="#555">endpoint-2.cognitiveservices</text>
  <rect x="370" y="164" width="115" height="38" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="0.8"/>
  <text x="427" y="179" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Speech Resource</text>
  <text x="427" y="194" text-anchor="middle" font-size="8" fill="#555">endpoint-3.cognitiveservices</text>
  <rect x="495" y="164" width="115" height="38" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="0.8"/>
  <text x="552" y="179" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">OpenAI Resource</text>
  <text x="552" y="194" text-anchor="middle" font-size="8" fill="#555">endpoint-4.openai.azure</text>
  <!-- Pros -->
  <rect x="370" y="215" width="240" height="125" rx="6" fill="#fff" stroke="#6c8ebf" stroke-width="1"/>
  <text x="490" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#6c8ebf">✓ Advantages</text>
  <text x="385" y="250" font-size="9" fill="#333">• Dedicated rate limits per service</text>
  <text x="385" y="265" font-size="9" fill="#333">• Granular access control (RBAC)</text>
  <text x="385" y="280" font-size="9" fill="#333">• Independent scaling</text>
  <text x="385" y="295" font-size="9" fill="#333">• Service-specific features</text>
  <text x="385" y="310" font-size="9" fill="#333">• Isolated billing per service</text>
  <text x="385" y="325" font-size="9" fill="#555">⚠ More resources to manage</text>
  <!-- Bottom note -->
  <rect x="130" y="362" width="390" height="28" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="325" y="380" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">💡 Exam Tip: Multi-service shares one key; single-service gives granular RBAC &amp; rate limits</text>
</svg>
