<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="650" height="400" fill="#f9fafb" rx="8"/>
  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Azure AI Service Security Architecture</text>
  <!-- Client App -->
  <rect x="30" y="55" width="120" height="55" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="90" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Client App</text>
  <text x="90" y="95" text-anchor="middle" font-size="9" fill="#555">Web / Mobile / API</text>
  <!-- Arrow to auth -->
  <line x1="150" y1="82" x2="190" y2="82" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Auth Layer -->
  <rect x="195" y="40" width="160" height="85" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="275" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Authentication</text>
  <rect x="210" y="68" width="130" height="22" rx="4" fill="#fff" stroke="#d6b656" stroke-width="0.8"/>
  <text x="275" y="83" text-anchor="middle" font-size="9" fill="#333">Key Auth (Ocp-Apim-*)</text>
  <rect x="210" y="95" width="130" height="22" rx="4" fill="#fff" stroke="#d6b656" stroke-width="0.8"/>
  <text x="275" y="110" text-anchor="middle" font-size="9" fill="#333">Microsoft Entra ID Token</text>
  <!-- Arrow to service -->
  <line x1="355" y1="82" x2="400" y2="82" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Azure AI Service -->
  <rect x="405" y="45" width="220" height="75" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="515" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Azure AI Service</text>
  <text x="515" y="85" text-anchor="middle" font-size="10" fill="#555">*.cognitiveservices.azure.com</text>
  <text x="515" y="100" text-anchor="middle" font-size="9" fill="#555">Endpoint + Resource ID</text>
  <!-- Security Controls - big container -->
  <rect x="30" y="140" width="595" height="245" rx="8" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="325" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#82b366">Security Controls</text>
  <!-- RBAC -->
  <rect x="50" y="175" width="170" height="90" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
  <text x="135" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">RBAC Roles</text>
  <text x="60" y="213" font-size="9" fill="#555">• Cognitive Services User</text>
  <text x="60" y="228" font-size="9" fill="#555">• Cognitive Services Contributor</text>
  <text x="60" y="243" font-size="9" fill="#555">• OpenAI User / Contributor</text>
  <text x="60" y="258" font-size="9" fill="#555">• Custom role definitions</text>
  <!-- Managed Identity -->
  <rect x="240" y="175" width="170" height="90" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2"/>
  <text x="325" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Managed Identity</text>
  <text x="252" y="213" font-size="9" fill="#555">• System-assigned MI</text>
  <text x="252" y="228" font-size="9" fill="#555">• User-assigned MI</text>
  <text x="252" y="243" font-size="9" fill="#555">• No credentials in code</text>
  <text x="252" y="258" font-size="9" fill="#555">• Auto-rotated tokens</text>
  <!-- Network Security -->
  <rect x="430" y="175" width="180" height="90" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="520" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Network Security</text>
  <text x="442" y="213" font-size="9" fill="#555">• VNet integration</text>
  <text x="442" y="228" font-size="9" fill="#555">• Private Endpoints</text>
  <text x="442" y="243" font-size="9" fill="#555">• IP firewall rules</text>
  <text x="442" y="258" font-size="9" fill="#555">• Service endpoints</text>
  <!-- Key Management -->
  <rect x="50" y="278" width="170" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
  <text x="135" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Key Management</text>
  <text x="60" y="316" font-size="9" fill="#555">• Key1 and Key2 rotation</text>
  <text x="60" y="331" font-size="9" fill="#555">• Azure Key Vault storage</text>
  <text x="60" y="346" font-size="9" fill="#555">• Disable key-based auth</text>
  <text x="60" y="361" font-size="9" fill="#555">• Regenerate independently</text>
  <!-- Data Protection -->
  <rect x="240" y="278" width="170" height="90" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/>
  <text x="325" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Data Protection</text>
  <text x="252" y="316" font-size="9" fill="#555">• Encryption at rest (CMK)</text>
  <text x="252" y="331" font-size="9" fill="#555">• Encryption in transit (TLS)</text>
  <text x="252" y="346" font-size="9" fill="#555">• Data residency control</text>
  <text x="252" y="361" font-size="9" fill="#555">• No training on your data</text>
  <!-- Monitoring -->
  <rect x="430" y="278" width="180" height="90" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.2"/>
  <text x="520" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Audit &amp; Monitoring</text>
  <text x="442" y="316" font-size="9" fill="#555">• Azure Activity Log</text>
  <text x="442" y="331" font-size="9" fill="#555">• Diagnostic settings</text>
  <text x="442" y="346" font-size="9" fill="#555">• Azure Monitor alerts</text>
  <text x="442" y="361" font-size="9" fill="#555">• Microsoft Defender</text>
</svg>
