<svg xmlns="http://www.w3.org/2000/svg" width="650" height="380" viewBox="0 0 650 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c8ebf"/>
    </marker>
  </defs>
  <rect width="650" height="380" fill="#f9fbfd" rx="8"/>
  <text x="325" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Multi-Model Orchestration (Semantic Kernel)</text>
  <!-- Orchestrator -->
  <rect x="220" y="45" width="210" height="65" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="325" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Orchestrator</text>
  <text x="325" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Semantic Kernel / AI Agent</text>
  <text x="325" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Planning, routing, memory</text>
  <!-- Arrows to Plugins -->
  <line x1="325" y1="110" x2="325" y2="140" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Plugins layer -->
  <rect x="120" y="145" width="410" height="55" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="325" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Plugins / Functions</text>
  <text x="325" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Native functions, Prompt functions, OpenAPI connectors</text>
  <!-- Arrows to models -->
  <line x1="160" y1="200" x2="100" y2="240" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="200" x2="250" y2="240" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="200" x2="400" y2="240" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="200" x2="550" y2="240" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Model 1: GPT-4o -->
  <rect x="30" y="245" width="140" height="65" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="100" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">GPT-4o</text>
  <text x="100" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Complex reasoning</text>
  <text x="100" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Multi-turn chat</text>
  <!-- Model 2: GPT-4o-mini -->
  <rect x="185" y="245" width="140" height="65" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="255" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">GPT-4o-mini</text>
  <text x="255" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Fast classification</text>
  <text x="255" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Simple tasks</text>
  <!-- Model 3: Embedding -->
  <rect x="340" y="245" width="140" height="65" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="410" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Embedding Model</text>
  <text x="410" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">text-embedding-3</text>
  <text x="410" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Semantic memory</text>
  <!-- Model 4: DALL-E -->
  <rect x="495" y="245" width="130" height="65" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="560" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">DALL-E 3</text>
  <text x="560" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Image generation</text>
  <text x="560" y="301" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Visual content</text>
  <!-- Footer -->
  <rect x="70" y="330" width="510" height="38" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="325" y="347" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Semantic Kernel routes tasks to optimal model based on complexity &amp; cost</text>
  <text x="325" y="361" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Plugins extend capabilities with custom logic, APIs, and data connectors</text>
</svg>
