<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 355" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 22 - Multi-Agent Conversation Flow</title>
  <desc id="desc">Lifecycle for creating an Azure AI agent conversation and reading the final assistant response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="658" height="353" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330.0" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Challenge 22 - Multi-Agent Conversation Flow</text>
<rect x="235" y="34" width="190" height="56" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
<text x="330.0" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Azure AI Agent Service</text>
<text x="330.0" y="73" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Managed run lifecycle</text>
<rect x="20" y="125" width="135" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="87.5" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Create Agent</text>
<text x="87.5" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Model + tools</text>
<rect x="180" y="125" width="135" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="247.5" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Create Thread</text>
<text x="247.5" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Conversation state</text>
<rect x="340" y="125" width="135" height="60" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
<text x="407.5" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Add Message</text>
<text x="407.5" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">User input</text>
<rect x="500" y="125" width="135" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
<text x="567.5" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Create Run</text>
<text x="567.5" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Start processing</text>
<rect x="180" y="235" width="145" height="62" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
<text x="252.5" y="257" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#333">Poll Run Status</text>
<text x="252.5" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">queued → in_progress</text>
<text x="252.5" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">→ completed</text>
<rect x="360" y="235" width="180" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="450.0" y="257" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#333">Assistant Response</text>
<text x="450.0" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Messages + citations</text>
<text x="450.0" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#444">Tool outputs</text>
<line x1="330" y1="90" x2="88" y2="125" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="88" y1="185" x2="248" y2="185" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="315" y1="185" x2="408" y2="185" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="475" y1="185" x2="568" y2="185" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="568" y1="185" x2="252" y2="235" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="325" y1="266" x2="360" y2="266" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="125" y="315" width="410" height="28" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
<text x="330.0" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#333">Typical flow: agent → thread → message → run → poll → assistant output.</text>
</svg>
