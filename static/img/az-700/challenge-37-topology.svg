<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Challenge 37: Hybrid Private Endpoint DNS with Private Resolver</text>

  <!-- On-Premises -->
  <rect x="20" y="50" width="200" height="200" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="120" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">On-Premises</text>

  <!-- On-prem DNS -->
  <rect x="40" y="90" width="160" height="50" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="120" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">On-Prem DNS Server</text>
  <text x="120" y="127" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">192.168.1.10</text>

  <!-- On-prem client -->
  <rect x="55" y="165" width="130" height="40" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="120" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">On-Prem Client</text>
  <text x="120" y="197" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">192.168.1.50</text>

  <!-- On-prem DNS zone -->
  <rect x="40" y="215" width="160" height="25" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">corp.contoso.com zone</text>

  <!-- VPN/ER Connection -->
  <rect x="230" y="130" width="90" height="35" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="275" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">VPN/ER</text>
  <text x="275" y="159" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">Gateway</text>

  <!-- Azure VNet -->
  <rect x="330" y="50" width="350" height="310" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="505" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Azure VNet (10.0.0.0/16)</text>

  <!-- Private Resolver -->
  <rect x="350" y="90" width="310" height="130" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="505" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Azure DNS Private Resolver</text>

  <!-- Inbound endpoint -->
  <rect x="370" y="125" width="130" height="45" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="435" y="143" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Inbound Endpoint</text>
  <text x="435" y="157" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.0.2.4</text>
  <text x="435" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">(receives from on-prem)</text>

  <!-- Outbound endpoint -->
  <rect x="520" y="125" width="130" height="45" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="585" y="143" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Outbound Endpoint</text>
  <text x="585" y="157" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.0.3.4</text>
  <text x="585" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">(forwards to on-prem)</text>

  <!-- Ruleset note -->
  <rect x="520" y="180" width="130" height="25" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="585" y="197" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">Ruleset: corp.contoso.com → 192.168.1.10</text>

  <!-- Private DNS Zone -->
  <rect x="370" y="240" width="200" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="470" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Private DNS Zone</text>
  <text x="470" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">privatelink.blob.core.windows.net</text>

  <!-- Private Endpoint -->
  <rect x="370" y="305" width="140" height="40" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="440" y="323" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Private Endpoint</text>
  <text x="440" y="337" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.0.1.4</text>

  <!-- Arrows - Inbound flow (green) -->
  <line x1="220" y1="115" x2="230" y2="140" stroke="#666" stroke-width="1.5"/>
  <line x1="320" y1="147" x2="368" y2="147" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="345" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e7d32">Conditional</text>
  <text x="345" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2e7d32">Forwarder</text>

  <!-- Inbound to DNS Zone -->
  <line x1="435" y1="170" x2="450" y2="238" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- DNS Zone to PE -->
  <line x1="440" y1="290" x2="440" y2="303" stroke="#2e7d32" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Outbound flow (orange) -->
  <line x1="520" y1="155" x2="320" y2="155" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>

  <!-- Flow Legend -->
  <rect x="20" y="380" width="660" height="90" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="350" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">DNS Resolution Flows</text>

  <line x1="40" y1="420" x2="80" y2="420" stroke="#2e7d32" stroke-width="2"/>
  <text x="90" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">Inbound: On-prem → Conditional Forwarder (10.0.2.4) → Private DNS Zone → PE IP</text>

  <line x1="40" y1="445" x2="80" y2="445" stroke="#d6b656" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="90" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#333">Outbound: Azure → Forwarding Ruleset (corp.contoso.com) → On-Prem DNS (192.168.1.10)</text>

  <text x="350" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Key: On-prem conditional forwarder target = Private Resolver inbound endpoint IP (10.0.2.4)</text>
</svg>
