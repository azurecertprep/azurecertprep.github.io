<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">ExpressRoute Advanced: Global Reach &amp; FastPath</text>

  <!-- On-Prem Site 1 (Left) -->
  <rect x="20" y="50" width="140" height="100" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Site 1</text>
  <text x="90" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">New York</text>
  <rect x="35" y="100" width="110" height="35" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="90" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">10.1.0.0/16</text>

  <!-- On-Prem Site 2 (Left bottom) -->
  <rect x="20" y="280" width="140" height="100" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="90" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Site 2</text>
  <text x="90" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">London</text>
  <rect x="35" y="330" width="110" height="35" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="90" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">10.2.0.0/16</text>

  <!-- Azure Cloud (Center) -->
  <rect x="220" y="50" width="280" height="330" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Azure Backbone</text>

  <!-- MSEE 1 -->
  <rect x="240" y="100" width="100" height="45" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="290" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">MSEE 1</text>
  <text x="290" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">East US</text>

  <!-- MSEE 2 -->
  <rect x="240" y="285" width="100" height="45" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="290" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">MSEE 2</text>
  <text x="290" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">UK South</text>

  <!-- Global Reach Connection -->
  <rect x="260" y="180" width="120" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Global Reach</text>
  <text x="320" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Site-to-Site via</text>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">MS backbone</text>

  <!-- MSEE1 to Global Reach -->
  <line x1="290" y1="145" x2="290" y2="178" stroke="#d6b656" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- MSEE2 to Global Reach -->
  <line x1="290" y1="283" x2="290" y2="252" stroke="#d6b656" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ER Gateway -->
  <rect x="400" y="165" width="80" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">ER GW</text>
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">UltraPerf</text>

  <!-- VNet -->
  <rect x="530" y="90" width="150" height="240" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="605" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Azure VNet</text>
  <text x="605" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">10.0.0.0/16</text>

  <rect x="545" y="145" width="120" height="35" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">VMs / Apps</text>

  <rect x="545" y="195" width="120" height="35" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">Storage</text>

  <rect x="545" y="245" width="120" height="35" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="267" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">Databases</text>

  <!-- ER Circuits to MSEEs -->
  <line x1="160" y1="120" x2="238" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="330" x2="238" y2="307" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Normal path: MSEE1 → GW → VNet -->
  <line x1="340" y1="120" x2="400" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="190" x2="528" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FastPath: Direct MSEE1 → VNet (bypasses GW) -->
  <path d="M 340 110 C 420 80, 480 80, 540 145" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="440" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#b85450">FastPath</text>
  <text x="440" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450">(bypasses GW)</text>

  <!-- Legend -->
  <text x="350" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Global Reach: site-to-site over MS backbone | FastPath: data plane bypasses ER Gateway for lower latency</text>
</svg>
