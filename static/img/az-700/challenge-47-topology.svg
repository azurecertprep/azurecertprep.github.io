<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Hub-Spoke with NVA Chaining</text>

  <!-- Hub VNet -->
  <rect x="200" y="50" width="300" height="220" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Hub VNet (10.0.0.0/16)</text>

  <!-- NVA -->
  <rect x="240" y="90" width="130" height="70" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="305" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">NVA (Firewall)</text>
  <text x="305" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.0.1.4</text>
  <text x="305" y="144" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450" font-weight="bold">IP Forwarding: ON</text>

  <!-- ILB -->
  <rect x="390" y="90" width="95" height="70" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="437" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">ILB</text>
  <text x="437" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.0.2.4</text>
  <text x="437" y="144" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">HA Ports rule</text>

  <!-- Arrow NVA to ILB -->
  <line x1="370" y1="125" x2="387" y2="125" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GatewaySubnet -->
  <rect x="240" y="180" width="220" height="45" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="350" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">GatewaySubnet</text>
  <text x="350" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">VPN/ER Gateway • UDR → NVA for on-prem return</text>

  <!-- Peering labels -->
  <text x="140" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c8ebf" font-weight="bold">VNet Peering</text>
  <text x="560" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c8ebf" font-weight="bold">VNet Peering</text>

  <!-- Spoke VNet 1 -->
  <rect x="20" y="300" width="220" height="140" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="130" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Spoke VNet 1 (10.1.0.0/16)</text>
  <text x="130" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Web Tier</text>

  <!-- UDR in Spoke 1 -->
  <rect x="40" y="352" width="180" height="75" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="130" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">UDR: Spoke1-to-Spoke2</text>
  <text x="130" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Dest: 10.2.0.0/16</text>
  <text x="130" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Next hop: 10.0.2.4 (ILB)</text>
  <text x="130" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450">Type: Virtual Appliance</text>

  <!-- Spoke VNet 2 -->
  <rect x="460" y="300" width="220" height="140" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="570" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Spoke VNet 2 (10.2.0.0/16)</text>
  <text x="570" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">DB Tier</text>

  <!-- UDR in Spoke 2 -->
  <rect x="480" y="352" width="180" height="75" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="570" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">UDR: Spoke2-to-Spoke1</text>
  <text x="570" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Dest: 10.1.0.0/16</text>
  <text x="570" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Next hop: 10.0.2.4 (ILB)</text>
  <text x="570" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450">Type: Virtual Appliance</text>

  <!-- Traffic flow arrows (UDR forced) -->
  <path d="M 130 300 L 130 270 L 305 160" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <path d="M 570 300 L 570 270 L 400 160" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>

  <!-- Flow labels -->
  <text x="190" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#b85450" font-weight="bold">UDR forced</text>
  <text x="470" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#b85450" font-weight="bold">UDR forced</text>
</svg>
