<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">User-Defined Routes (UDR) with NVA</text>

  <!-- Internet Cloud -->
  <ellipse cx="600" cy="70" rx="70" ry="35" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="600" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Internet</text>

  <!-- Hub VNet -->
  <rect x="250" y="110" width="250" height="200" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="375" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Hub VNet (10.0.0.0/16)</text>

  <!-- NVA in Hub -->
  <rect x="290" y="150" width="170" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="375" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Network Virtual Appliance</text>
  <text x="375" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">NVA Subnet: 10.0.2.0/24</text>
  <text x="375" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">IP: 10.0.2.4 (IP Forwarding: ON)</text>

  <!-- Route Table in Hub -->
  <rect x="290" y="225" width="170" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="375" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Route Table (Hub)</text>
  <text x="375" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">0.0.0.0/0 → NVA 10.0.2.4</text>
  <text x="375" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.1.0.0/16 → VNet Peering</text>

  <!-- Spoke VNet -->
  <rect x="30" y="180" width="190" height="180" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="125" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Spoke VNet (10.1.0.0/16)</text>

  <!-- VMs in Spoke -->
  <rect x="50" y="215" width="70" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="85" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-1</text>
  <text x="85" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.1.1.4</text>

  <rect x="135" y="215" width="70" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="170" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-2</text>
  <text x="170" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.1.1.5</text>

  <!-- UDR on Spoke -->
  <rect x="50" y="270" width="155" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="127" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">UDR (Spoke Subnet)</text>
  <text x="127" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">0.0.0.0/0 → 10.0.2.4</text>
  <text x="127" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Next Hop: Virtual Appliance</text>

  <!-- Traffic Flow Arrows -->
  <!-- Spoke → NVA -->
  <line x1="220" y1="240" x2="290" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#666">①</text>

  <!-- NVA → Internet -->
  <line x1="460" y1="165" x2="540" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#666">②</text>

  <!-- Flow description -->
  <rect x="80" y="385" width="540" height="45" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="350" y="403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Traffic Flow: Spoke VM → UDR overrides default route → NVA inspects/filters → Internet</text>
  <text x="350" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">NVA requires IP Forwarding enabled on NIC + UDR next hop type = "Virtual Appliance"</text>
</svg>
