<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Challenge 25: Azure Load Balancer with Backend Pool</text>

  <!-- Internet/Client -->
  <rect x="290" y="45" width="120" height="40" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="350" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Internet/Clients</text>

  <!-- Arrow to Public LB -->
  <line x1="350" y1="85" x2="350" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Public Load Balancer -->
  <rect x="250" y="125" width="200" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Public Load Balancer</text>
  <text x="350" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">Frontend IP: Public IP</text>

  <!-- Health Probes -->
  <rect x="500" y="130" width="130" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="565" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Health Probes</text>
  <text x="565" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">HTTP/TCP/HTTPS</text>
  <line x1="500" y1="150" x2="450" y2="150" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- LB Rules -->
  <rect x="70" y="130" width="130" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="135" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LB Rules</text>
  <text x="135" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Port 80/443 → Pool</text>
  <line x1="200" y1="150" x2="250" y2="150" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrows to VMs -->
  <line x1="300" y1="175" x2="180" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="175" x2="350" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="175" x2="520" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Web Tier Backend Pool -->
  <rect x="80" y="215" width="540" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="350" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Backend Pool — Web Tier</text>

  <!-- VM 1 -->
  <rect x="110" y="245" width="120" height="55" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="170" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VM-Web-01</text>
  <text x="170" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">10.0.1.4</text>
  <text x="170" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Zone 1</text>

  <!-- VM 2 -->
  <rect x="290" y="245" width="120" height="55" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="350" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VM-Web-02</text>
  <text x="350" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">10.0.1.5</text>
  <text x="350" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Zone 2</text>

  <!-- VM 3 -->
  <rect x="470" y="245" width="120" height="55" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="530" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VM-Web-03</text>
  <text x="530" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">10.0.1.6</text>
  <text x="530" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Zone 3</text>

  <!-- Arrows to Internal LB -->
  <line x1="350" y1="315" x2="350" y2="360" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internal Load Balancer -->
  <rect x="250" y="365" width="200" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Internal Load Balancer</text>
  <text x="350" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">Frontend IP: 10.0.2.10</text>

  <!-- Arrows to Data VMs -->
  <line x1="300" y1="415" x2="200" y2="455" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="415" x2="500" y2="455" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data Tier Backend Pool -->
  <rect x="100" y="445" width="500" height="65" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="350" y="463" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Backend Pool — Data Tier</text>

  <!-- Data VM 1 -->
  <rect x="130" y="472" width="140" height="30" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="200" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">VM-SQL-01 (10.0.2.4)</text>

  <!-- Data VM 2 -->
  <rect x="430" y="472" width="140" height="30" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="500" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">VM-SQL-02 (10.0.2.5)</text>
</svg>
