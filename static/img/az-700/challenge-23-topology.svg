<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Virtual WAN Routing: Route Tables &amp; Routing Intent</text>

  <!-- vWAN Hub -->
  <rect x="180" y="50" width="340" height="230" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Virtual WAN Hub</text>

  <!-- Route Table: RT_PROD -->
  <rect x="200" y="90" width="140" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="270" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">RT_PROD</text>
  <text x="270" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Routes: 10.1.0.0/16</text>
  <text x="270" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Routes: 10.3.0.0/16</text>
  <text x="270" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Next hop: hub</text>

  <!-- Route Table: RT_DEV -->
  <rect x="360" y="90" width="140" height="80" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="430" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">RT_DEV</text>
  <text x="430" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Routes: 10.2.0.0/16</text>
  <text x="430" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Routes: 10.4.0.0/16</text>
  <text x="430" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Next hop: hub</text>

  <!-- Routing Intent -->
  <rect x="240" y="195" width="220" height="65" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="350" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Routing Intent</text>
  <text x="350" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Internet traffic → Azure Firewall</text>
  <text x="350" y="247" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Private traffic → Azure Firewall</text>

  <!-- Spoke VNet Prod1 (left) -->
  <rect x="20" y="310" width="130" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="85" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Prod VNet 1</text>
  <text x="85" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.1.0.0/16</text>
  <text x="85" y="363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Assoc: RT_PROD</text>

  <!-- Spoke VNet Prod2 -->
  <rect x="170" y="310" width="130" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="235" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Shared Svc</text>
  <text x="235" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.3.0.0/16</text>
  <text x="235" y="363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Assoc: RT_PROD</text>

  <!-- Spoke VNet Dev1 -->
  <rect x="400" y="310" width="130" height="60" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="465" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Dev VNet</text>
  <text x="465" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.2.0.0/16</text>
  <text x="465" y="363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Assoc: RT_DEV</text>

  <!-- Spoke VNet Dev2 -->
  <rect x="550" y="310" width="130" height="60" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="615" y="333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Test VNet</text>
  <text x="615" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.4.0.0/16</text>
  <text x="615" y="363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Assoc: RT_DEV</text>

  <!-- Association arrows (solid) -->
  <line x1="85" y1="308" x2="250" y2="172" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="235" y1="308" x2="260" y2="172" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="465" y1="308" x2="440" y2="172" stroke="#d6b656" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="308" x2="450" y2="172" stroke="#d6b656" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Propagation labels -->
  <text x="130" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#82b366" font-weight="bold">Association</text>
  <text x="560" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#d6b656" font-weight="bold">Association</text>

  <!-- Isolation note -->
  <rect x="260" y="390" width="180" height="35" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="350" y="407" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#b85450">✗ No Dev↔Prod traffic</text>
  <text x="350" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Isolation via separate route tables</text>

  <!-- Legend -->
  <text x="350" y="445" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Association = which RT a connection uses | Propagation = which RTs learn a connection's routes</text>
</svg>
