<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Challenge 28: Application Gateway Request Flow</text>

  <!-- Client -->
  <rect x="290" y="42" width="120" height="36" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="350" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Clients</text>

  <!-- Arrow -->
  <line x1="350" y1="78" x2="350" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">HTTPS</text>

  <!-- Application Gateway Container -->
  <rect x="50" y="108" width="600" height="280" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Application Gateway (Layer 7)</text>

  <!-- Frontend IP -->
  <rect x="275" y="138" width="150" height="35" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="350" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Frontend IP (Public/Private)</text>

  <!-- Arrow -->
  <line x1="350" y1="173" x2="350" y2="193" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Listeners -->
  <rect x="80" y="195" width="540" height="50" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="350" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Listeners (Multi-Site)</text>

  <rect x="95" y="220" width="140" height="20" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="165" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">shop.contoso.com:443</text>

  <rect x="250" y="220" width="140" height="20" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="320" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">api.contoso.com:443</text>

  <rect x="405" y="220" width="140" height="20" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="475" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">*.contoso.com:443</text>

  <!-- Arrow -->
  <line x1="350" y1="245" x2="350" y2="262" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Routing Rules -->
  <rect x="200" y="265" width="300" height="35" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="350" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Routing Rules (Basic / Path-based)</text>

  <!-- Arrow to Path Map -->
  <line x1="350" y1="300" x2="350" y2="318" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Path Map -->
  <rect x="80" y="320" width="540" height="55" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="350" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">URL Path Map</text>

  <rect x="95" y="345" width="130" height="22" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="160" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">/images/* → Pool A</text>

  <rect x="240" y="345" width="130" height="22" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="305" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">/api/* → Pool B</text>

  <rect x="385" y="345" width="130" height="22" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="450" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">/* (default) → Pool C</text>

  <!-- WAF badge -->
  <rect x="555" y="135" width="75" height="30" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="592" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#b85450">WAF v2</text>
  <text x="592" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">OWASP 3.2</text>

  <!-- Arrows to Backend Pools -->
  <line x1="160" y1="375" x2="120" y2="415" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="375" x2="350" y2="415" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="375" x2="560" y2="415" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend Pool A -->
  <rect x="55" y="418" width="140" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="125" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pool A: Storage</text>
  <text x="125" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Blob CDN</text>
  <text x="125" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Static Content</text>

  <!-- Backend Pool B -->
  <rect x="275" y="418" width="140" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="345" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pool B: API</text>
  <text x="345" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">App Service</text>
  <text x="345" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">api-backend.azurewebsites.net</text>

  <!-- Backend Pool C -->
  <rect x="495" y="418" width="140" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="565" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pool C: Web</text>
  <text x="565" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">VMSS</text>
  <text x="565" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Web Frontend VMs</text>

  <!-- HTTP Settings note -->
  <rect x="200" y="488" width="300" height="30" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="350" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">HTTP Settings: Port, Protocol, Cookie Affinity, Connection Draining</text>
</svg>
