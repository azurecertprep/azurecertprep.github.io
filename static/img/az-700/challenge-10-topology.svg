<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Azure NAT Gateway — Outbound Connectivity</text>

  <!-- Internet -->
  <ellipse cx="590" cy="70" rx="80" ry="35" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="590" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Internet</text>

  <!-- Public IP -->
  <rect x="430" y="130" width="160" height="55" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="510" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Public IP (Static)</text>
  <text x="510" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">20.50.100.1</text>
  <text x="510" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">Standard SKU</text>

  <!-- Arrow: Public IP to Internet -->
  <line x1="555" y1="130" x2="575" y2="105" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NAT Gateway -->
  <rect x="230" y="125" width="180" height="65" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">NAT Gateway</text>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Idle timeout: 4-120 min</text>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">64K SNAT ports per IP</text>

  <!-- Arrow: NAT GW to Public IP -->
  <line x1="410" y1="157" x2="430" y2="157" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VNet -->
  <rect x="50" y="215" width="550" height="180" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="325" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">VNet (10.0.0.0/16)</text>

  <!-- Subnet with NAT GW -->
  <rect x="75" y="250" width="240" height="130" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="195" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Workload Subnet (10.0.1.0/24)</text>
  <text x="195" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#82b366" font-weight="bold">NAT Gateway: Associated ✓</text>

  <!-- VMs -->
  <rect x="90" y="300" width="65" height="40" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="122" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-1</text>
  <text x="122" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">No PIP</text>

  <rect x="165" y="300" width="65" height="40" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="197" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-2</text>
  <text x="197" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">No PIP</text>

  <rect x="240" y="300" width="65" height="40" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="272" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-3</text>
  <text x="272" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">No PIP</text>

  <!-- Subnet without NAT -->
  <rect x="340" y="250" width="240" height="130" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="460" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Other Subnet (10.0.2.0/24)</text>
  <text x="460" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450">NAT Gateway: None</text>

  <rect x="405" y="310" width="110" height="35" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="460" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">VM-4 (needs PIP</text>
  <text x="460" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">for outbound)</text>

  <!-- Arrow: Subnet to NAT GW -->
  <line x1="195" y1="250" x2="280" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">All outbound</text>

  <!-- Info -->
  <rect x="80" y="405" width="540" height="28" rx="4" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="350" y="423" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">All VMs in the subnet share the same outbound Public IP (20.50.100.1) — no individual PIPs needed</text>
</svg>
