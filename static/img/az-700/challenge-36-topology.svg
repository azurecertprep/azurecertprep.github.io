<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Challenge 36: Private Link Service — Provider/Consumer Model</text>

  <!-- Provider boundary -->
  <rect x="20" y="45" width="320" height="350" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="180" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">PROVIDER (Your Subscription)</text>

  <!-- Provider VNet -->
  <rect x="35" y="80" width="290" height="300" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="180" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Provider VNet</text>

  <!-- Backend VMs -->
  <rect x="55" y="115" width="100" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="105" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Backend VM 1</text>
  <text x="105" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.1.0.4</text>

  <rect x="175" y="115" width="100" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="225" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Backend VM 2</text>
  <text x="225" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.1.0.5</text>

  <!-- Standard ILB -->
  <rect x="90" y="180" width="180" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="180" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Standard Internal LB</text>
  <text x="180" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Frontend: 10.1.0.10</text>

  <!-- Arrows to ILB -->
  <line x1="105" y1="155" x2="150" y2="180" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="225" y1="155" x2="210" y2="180" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Private Link Service -->
  <rect x="70" y="260" width="220" height="55" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="180" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Private Link Service</text>
  <text x="180" y="297" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">NAT IP: 10.1.2.4 (NAT subnet)</text>
  <text x="180" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9673a6">Alias: myservice.{guid}.region.azure.privatelinkservice</text>

  <!-- Arrow ILB to PLS -->
  <line x1="180" y1="230" x2="180" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Boundary line -->
  <line x1="350" y1="55" x2="350" y2="385" stroke="#666" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="350" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#666">Azure Private Link Boundary</text>

  <!-- Consumer boundary -->
  <rect x="370" y="45" width="310" height="350" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="525" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">CONSUMER (Other Subscription)</text>

  <!-- Consumer VNet -->
  <rect x="385" y="80" width="280" height="200" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="525" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Consumer VNet</text>

  <!-- Consumer VM -->
  <rect x="440" y="115" width="120" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="500" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">Consumer VM</text>
  <text x="500" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555">10.2.0.4</text>

  <!-- Private Endpoint in Consumer -->
  <rect x="420" y="190" width="160" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="500" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Private Endpoint</text>
  <text x="500" y="227" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">NIC: 10.2.1.4</text>

  <!-- Arrow VM to PE -->
  <line x1="500" y1="155" x2="500" y2="188" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Connection PE to PLS -->
  <path d="M 420 215 Q 360 250 290 287" stroke="#6c8ebf" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="380" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c8ebf">Connected via alias</text>

  <!-- Approval note -->
  <rect x="400" y="310" width="250" height="60" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="525" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Connection Approval</text>
  <text x="525" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">• Auto-approve (whitelisted subscriptions)</text>
  <text x="525" y="358" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">• Manual approve (provider approves)</text>

  <!-- Key note at bottom -->
  <rect x="20" y="415" width="660" height="28" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="350" y="434" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">NAT ensures provider backend IPs are never exposed to consumer — consumer only sees their PE IP</text>
</svg>
