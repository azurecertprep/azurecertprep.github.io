<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Azure DDoS Protection — Attack Mitigation</text>

  <!-- Attacker -->
  <rect x="30" y="50" width="120" height="55" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="90" y="73" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#b85450">DDoS Attack</text>
  <text x="90" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Volumetric/Protocol</text>

  <!-- Attack arrows -->
  <line x1="150" y1="77" x2="220" y2="77" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="67" x2="220" y2="67" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="87" x2="220" y2="87" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DDoS Protection Plan -->
  <rect x="220" y="35" width="260" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="350" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">DDoS Protection Plan</text>
  <text x="350" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Always-on monitoring</text>
  <text x="350" y="93" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Auto-tuned thresholds</text>
  <text x="350" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">L3/L4 mitigation</text>
  <text x="350" y="123" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">DDoS Rapid Response (DRR)</text>

  <!-- Clean traffic -->
  <line x1="350" y1="135" x2="350" y2="170" stroke="#82b366" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#82b366">Clean traffic</text>

  <!-- Mitigated label -->
  <text x="530" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b85450" font-weight="bold">Attack traffic ✗ dropped</text>
  <line x1="480" y1="77" x2="570" y2="77" stroke="#b85450" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- VNet with DDoS -->
  <rect x="100" y="175" width="500" height="230" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="197" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">VNet — DDoS Protection: Enabled</text>

  <!-- Public IP Resources -->
  <text x="350" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" fill="#555">Protected Public IPs</text>

  <!-- Resource 1: App Gateway -->
  <rect x="120" y="230" width="140" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="190" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">App Gateway</text>
  <text x="190" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">PIP: 20.50.1.1</text>
  <rect x="135" y="278" width="110" height="20" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="190" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#333">✓ Protected</text>

  <!-- Resource 2: Load Balancer -->
  <rect x="280" y="230" width="140" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="350" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Load Balancer</text>
  <text x="350" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">PIP: 20.50.2.1</text>
  <rect x="295" y="278" width="110" height="20" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="350" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#333">✓ Protected</text>

  <!-- Resource 3: VM PIP -->
  <rect x="440" y="230" width="140" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="510" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">VM Public IP</text>
  <text x="510" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">PIP: 20.50.3.1</text>
  <rect x="455" y="278" width="110" height="20" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="510" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#333">✓ Protected</text>

  <!-- Backend VMs -->
  <rect x="120" y="330" width="460" height="55" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="350" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Backend VMs / Services (Private IPs)</text>
  <text x="350" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.0.1.4 | 10.0.1.5 | 10.0.1.6 | 10.0.2.4</text>

  <!-- Telemetry / Metrics -->
  <rect x="100" y="420" width="500" height="40" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="350" y="437" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">Metrics &amp; Alerts: Packets In/Out | Bytes Dropped | Mitigation Trigger | Attack Vectors</text>
  <text x="350" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Cost protection SLA | Diagnostic logs → Log Analytics | Covers all Public IPs in the VNet</text>
</svg>
