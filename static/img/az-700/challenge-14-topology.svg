<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Site-to-Site VPN Topology</text>

  <!-- On-Premises -->
  <rect x="20" y="50" width="180" height="220" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="110" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">On-Premises</text>

  <!-- On-prem network -->
  <rect x="40" y="90" width="140" height="60" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="110" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Local Network</text>
  <text x="110" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">10.1.0.0/16</text>

  <!-- VPN Device -->
  <rect x="50" y="170" width="120" height="50" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="110" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">VPN Device</text>
  <text x="110" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Public IP</text>

  <!-- VPN Tunnel -->
  <line x1="200" y1="195" x2="310" y2="195" stroke="#666" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <rect x="220" y="175" width="80" height="30" rx="4" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="260" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">IPsec/IKE</text>
  <text x="260" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Internet</text>

  <!-- Azure Cloud -->
  <rect x="320" y="50" width="360" height="220" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="500" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Azure Cloud</text>

  <!-- VPN Gateway -->
  <rect x="340" y="160" width="130" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="405" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">VPN Gateway</text>
  <text x="405" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">GatewaySubnet</text>

  <!-- Gateway Subnet -->
  <rect x="340" y="95" width="130" height="45" rx="4" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="405" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">GatewaySubnet</text>
  <text x="405" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">/27 minimum</text>

  <!-- Arrow from GW to subnet -->
  <line x1="405" y1="140" x2="405" y2="158" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VNet -->
  <rect x="510" y="90" width="150" height="140" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="585" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Azure VNet</text>
  <text x="585" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">10.0.0.0/16</text>

  <!-- Subnets -->
  <rect x="525" y="140" width="120" height="35" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="585" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">Workload Subnet</text>

  <rect x="525" y="185" width="120" height="35" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="585" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">App Subnet</text>

  <!-- Arrow from VPN GW to VNet -->
  <line x1="470" y1="190" x2="508" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="350" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Encrypted IPsec tunnel over public internet connects on-premises to Azure VNet</text>
</svg>
