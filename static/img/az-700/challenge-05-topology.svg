<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Global VNet Peering with Gateway Transit</text>

  <!-- Region 1 -->
  <rect x="30" y="50" width="300" height="350" rx="8" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Region: East US</text>

  <!-- Hub VNet (Region 1) -->
  <rect x="55" y="85" width="250" height="200" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="180" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Hub VNet (10.0.0.0/16)</text>

  <!-- VPN Gateway -->
  <rect x="80" y="120" width="200" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="180" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">VPN Gateway</text>
  <text x="180" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">GatewaySubnet (10.0.255.0/27)</text>

  <!-- Workload Subnet -->
  <rect x="80" y="185" width="200" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="180" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Workload (10.0.1.0/24)</text>

  <!-- Gateway transit label -->
  <rect x="80" y="240" width="200" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="180" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">✓ Allow Gateway Transit</text>

  <!-- On-premises -->
  <rect x="80" y="310" width="200" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="180" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">On-Premises Network</text>
  <text x="180" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">192.168.0.0/16</text>
  <text x="180" y="367" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Local Network Gateway</text>

  <!-- VPN tunnel -->
  <line x1="180" y1="170" x2="180" y2="310" stroke="#9673a6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="195" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#9673a6">S2S VPN</text>

  <!-- Region 2 -->
  <rect x="370" y="50" width="300" height="250" rx="8" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="520" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Region: West Europe</text>

  <!-- Remote VNet (Region 2) -->
  <rect x="395" y="85" width="250" height="190" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="520" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Spoke VNet (10.1.0.0/16)</text>

  <!-- Remote workload -->
  <rect x="420" y="120" width="200" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="520" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">App Tier (10.1.1.0/24)</text>

  <rect x="420" y="175" width="200" height="40" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="520" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Data Tier (10.1.2.0/24)</text>

  <!-- Use remote gateway label -->
  <rect x="420" y="230" width="200" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="520" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">✓ Use Remote Gateways</text>

  <!-- Global Peering Arrow -->
  <line x1="305" y1="180" x2="395" y2="180" stroke="#6c8ebf" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="350" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="#6c8ebf">Global Peering</text>

  <!-- Traffic flow annotation -->
  <rect x="370" y="340" width="300" height="60" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="520" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Traffic Flow:</text>
  <text x="520" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">On-Prem → VPN GW → Hub → Global Peer → Spoke</text>
  <text x="520" y="393" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Spoke uses Hub's gateway for on-prem connectivity</text>

  <!-- Note -->
  <text x="350" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Note: Global peering works across regions but gateway transit must be explicitly enabled on both sides</text>
</svg>
