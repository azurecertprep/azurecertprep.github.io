<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">Subnet Delegation &amp; Service Endpoints</text>

  <!-- VNet Container -->
  <rect x="50" y="45" width="600" height="430" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">VNet: prod-vnet (10.0.0.0/16)</text>

  <!-- Subnet 1 - App Service Delegation -->
  <rect x="80" y="85" width="250" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="205" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">app-subnet (10.0.1.0/24)</text>
  <rect x="95" y="115" width="220" height="28" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="205" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">Delegation: Microsoft.Web/serverFarms</text>
  <text x="205" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">→ App Service VNet Integration</text>

  <!-- Subnet 2 - SQL MI Delegation -->
  <rect x="370" y="85" width="250" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="495" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">sql-subnet (10.0.2.0/24)</text>
  <rect x="385" y="115" width="220" height="28" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="495" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">Delegation: Microsoft.Sql/managedInstances</text>
  <text x="495" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">→ SQL Managed Instance</text>

  <!-- Subnet 3 - Container Instances Delegation -->
  <rect x="80" y="200" width="250" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="205" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">aci-subnet (10.0.3.0/24)</text>
  <rect x="95" y="230" width="220" height="28" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="205" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">Delegation: Microsoft.ContainerInstance/containerGroups</text>
  <text x="205" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">→ Container Instances</text>

  <!-- Subnet 4 - Service Endpoints -->
  <rect x="370" y="200" width="250" height="90" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="495" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">workload-subnet (10.0.4.0/24)</text>
  <text x="495" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Service Endpoints Enabled:</text>
  <rect x="385" y="248" width="105" height="22" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="437" y="263" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">Microsoft.Storage</text>
  <rect x="500" y="248" width="105" height="22" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="552" y="263" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">Microsoft.Sql</text>

  <!-- Service Endpoint targets -->
  <rect x="400" y="340" width="130" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="465" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Azure Storage</text>
  <text x="465" y="377" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">PaaS Service</text>

  <rect x="550" y="340" width="130" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="615" y="362" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Azure SQL DB</text>
  <text x="615" y="377" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">PaaS Service</text>

  <!-- Arrows from service endpoints -->
  <line x1="437" y1="290" x2="437" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="552" y1="290" x2="600" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="80" y="410" width="540" height="50" rx="6" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
  <text x="100" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Key:</text>
  <rect x="100" y="438" width="12" height="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="118" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Delegation = Subnet owned by Azure service</text>
  <rect x="340" y="438" width="12" height="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="358" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">Service Endpoint = Optimized route to PaaS</text>
</svg>
