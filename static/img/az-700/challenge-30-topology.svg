<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Challenge 30: Autoscale &amp; Connection Draining</text>

  <!-- Main Container -->
  <rect x="30" y="40" width="640" height="240" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Application Gateway v2 — Autoscale</text>

  <!-- Capacity Units explanation -->
  <rect x="50" y="72" width="280" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="190" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Capacity Unit (CU) Components</text>
  <text x="190" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">1 CU = max of:</text>
  <text x="190" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• 2,500 persistent connections</text>
  <text x="190" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• 2.22 Mbps throughput</text>
  <text x="190" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• 10 compute units (new conn/sec)</text>

  <!-- Autoscale Config -->
  <rect x="370" y="72" width="280" height="90" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="510" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Autoscale Configuration</text>
  <text x="510" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Min instances: 2 (always running)</text>
  <text x="510" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Max instances: 125</text>
  <text x="510" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Scale up: ~6-7 min warm-up</text>
  <text x="510" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Billing: per CU consumed</text>

  <!-- Scale decision flow -->
  <rect x="130" y="180" width="140" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="200" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Load Increases</text>
  <text x="200" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">CU threshold hit</text>

  <line x1="270" y1="200" x2="320" y2="200" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="325" y="180" width="120" height="40" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="385" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">Scale OUT</text>
  <text x="385" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Add instances</text>

  <rect x="130" y="235" width="140" height="40" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="200" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Load Decreases</text>
  <text x="200" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Below threshold</text>

  <line x1="270" y1="255" x2="320" y2="255" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="325" y="235" width="120" height="40" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="385" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#c62828">Scale IN</text>
  <text x="385" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Remove instances</text>

  <!-- Connection Draining Section -->
  <rect x="30" y="300" width="640" height="200" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="350" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Connection Draining During Deployment</text>

  <!-- Timeline flow -->
  <rect x="60" y="340" width="120" height="50" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="120" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1. Backend</text>
  <text x="120" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Marked for</text>
  <text x="120" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">removal</text>

  <line x1="180" y1="365" x2="215" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="340" width="130" height="50" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="285" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2. Drain Timer</text>
  <text x="285" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">1-3600 seconds</text>
  <text x="285" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Existing conns finish</text>

  <line x1="350" y1="365" x2="385" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="390" y="340" width="120" height="50" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">3. No New</text>
  <text x="450" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Connections sent</text>
  <text x="450" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">to this backend</text>

  <line x1="510" y1="365" x2="535" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="340" width="110" height="50" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="595" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">4. Removed</text>
  <text x="595" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Gracefully</text>
  <text x="595" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">removed ✓</text>

  <!-- Use Cases -->
  <rect x="60" y="410" width="250" height="75" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="185" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">When to Enable Draining</text>
  <text x="185" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Rolling deployments</text>
  <text x="185" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Backend maintenance windows</text>
  <text x="185" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Scale-in operations</text>
  <text x="185" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Health probe failures</text>

  <rect x="380" y="410" width="270" height="75" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="515" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Key Settings</text>
  <text x="515" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Timeout: 1-3600 sec (default: 30s)</text>
  <text x="515" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Configured per HTTP Settings</text>
  <text x="515" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Applies to pool removals only</text>
  <text x="515" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Not for health probe failures by default</text>
</svg>
