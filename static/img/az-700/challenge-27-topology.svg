<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Challenge 27: Traffic Manager with Multi-Region Endpoints</text>

  <!-- Client DNS Query -->
  <rect x="270" y="42" width="160" height="36" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="350" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Client DNS Query</text>

  <!-- Arrow to TM -->
  <line x1="350" y1="78" x2="350" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Traffic Manager Profile -->
  <rect x="175" y="110" width="350" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="350" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Azure Traffic Manager</text>
  <text x="350" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555" text-anchor="middle">DNS-based global load balancer (no inline traffic)</text>
  <text x="350" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">app.trafficmanager.net → CNAME to healthy endpoint</text>

  <!-- Routing Methods -->
  <rect x="40" y="185" width="130" height="65" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="105" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Routing Methods</text>
  <text x="105" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Priority</text>
  <text x="105" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Weighted</text>
  <text x="105" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">• Geographic/Perf</text>

  <!-- Monitor Settings -->
  <rect x="530" y="185" width="130" height="65" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="595" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Health Monitor</text>
  <text x="595" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Protocol: HTTP/S</text>
  <text x="595" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Interval: 30s</text>
  <text x="595" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Failures: 3 → offline</text>

  <!-- Connector lines to methods/monitor -->
  <line x1="175" y1="150" x2="170" y2="150" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="170" y1="150" x2="170" y2="210" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="525" y1="150" x2="530" y2="150" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="530" y1="150" x2="530" y2="210" stroke="#d6b656" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrows to endpoints -->
  <line x1="250" y1="170" x2="130" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="165" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">Priority: 1</text>

  <line x1="350" y1="170" x2="350" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Priority: 2</text>

  <line x1="450" y1="170" x2="570" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Priority: 3</text>

  <!-- Endpoint 1: Azure -->
  <rect x="50" y="295" width="160" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="130" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Azure Endpoint</text>
  <text x="130" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">App Service East US</text>
  <rect x="75" y="340" width="110" height="25" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="130" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">webapp-east.azurewebsites.net</text>

  <!-- Endpoint 2: Azure -->
  <rect x="270" y="295" width="160" height="80" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="350" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Azure Endpoint</text>
  <text x="350" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">App Service West EU</text>
  <rect x="295" y="340" width="110" height="25" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="350" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">webapp-west.azurewebsites.net</text>

  <!-- Endpoint 3: External -->
  <rect x="490" y="295" width="160" height="80" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="570" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">External Endpoint</text>
  <text x="570" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">On-premises / AWS</text>
  <rect x="515" y="340" width="110" height="25" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="570" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">dr-site.contoso.com</text>

  <!-- Nested Profile -->
  <rect x="175" y="410" width="350" height="95" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="350" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Nested Profile (Weighted)</text>
  <text x="350" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Child profile for A/B testing between deployments</text>

  <rect x="195" y="455" width="130" height="35" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="260" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">Slot: Production (80%)</text>
  <text x="260" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">Weight: 80</text>

  <rect x="375" y="455" width="130" height="35" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="440" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="middle">Slot: Staging (20%)</text>
  <text x="440" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">Weight: 20</text>

  <!-- Arrow from Endpoint 1 to Nested -->
  <line x1="130" y1="375" x2="130" y2="440" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="130" y1="440" x2="175" y2="440" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
