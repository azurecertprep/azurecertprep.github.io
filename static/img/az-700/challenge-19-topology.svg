<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">ExpressRoute Private Peering Architecture</text>

  <!-- On-Premises -->
  <rect x="20" y="55" width="140" height="240" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="90" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">On-Premises</text>

  <rect x="35" y="95" width="110" height="45" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
  <text x="90" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Data Center</text>
  <text x="90" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">10.1.0.0/16</text>

  <rect x="35" y="155" width="110" height="40" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="90" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">CE Router</text>
  <text x="90" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">BGP AS 65001</text>

  <!-- Provider Edge -->
  <rect x="200" y="80" width="120" height="200" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="260" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Provider</text>
  <text x="260" y="117" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Edge</text>

  <rect x="215" y="135" width="90" height="35" rx="4" fill="#fff" stroke="#d6b656" stroke-width="1"/>
  <text x="260" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">PE Primary</text>

  <rect x="215" y="195" width="90" height="35" rx="4" fill="#fff" stroke="#d6b656" stroke-width="1"/>
  <text x="260" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">PE Secondary</text>

  <!-- MSEE -->
  <rect x="365" y="80" width="120" height="200" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="425" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Microsoft</text>
  <text x="425" y="117" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Edge (MSEE)</text>

  <rect x="380" y="135" width="90" height="35" rx="4" fill="#fff" stroke="#9673a6" stroke-width="1"/>
  <text x="425" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">MSEE Pri</text>

  <rect x="380" y="195" width="90" height="35" rx="4" fill="#fff" stroke="#9673a6" stroke-width="1"/>
  <text x="425" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">MSEE Sec</text>

  <!-- Azure -->
  <rect x="530" y="55" width="150" height="240" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="605" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Azure</text>

  <rect x="545" y="95" width="120" height="40" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="605" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">ER Gateway</text>
  <text x="605" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#555">GatewaySubnet</text>

  <rect x="545" y="150" width="120" height="120" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="605" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">VNet 10.0.0.0/16</text>
  <rect x="555" y="180" width="100" height="25" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="197" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">Workloads</text>
  <rect x="555" y="215" width="100" height="25" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">Databases</text>
  <rect x="555" y="250" width="100" height="25" rx="4" fill="#fff" stroke="#82b366" stroke-width="1"/>
  <text x="605" y="267" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9">Services</text>

  <!-- Primary Circuit (top) -->
  <line x1="145" y1="152" x2="213" y2="152" stroke="#82b366" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="152" x2="378" y2="152" stroke="#82b366" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Secondary Circuit (bottom) -->
  <line x1="145" y1="212" x2="213" y2="212" stroke="#d6b656" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <line x1="305" y1="212" x2="378" y2="212" stroke="#d6b656" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- MSEE to ER Gateway -->
  <line x1="485" y1="152" x2="543" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="212" x2="543" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ER GW to VNet -->
  <line x1="605" y1="135" x2="605" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="230" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#82b366" font-weight="bold">Primary</text>
  <text x="230" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#d6b656" font-weight="bold">Secondary</text>

  <!-- Legend -->
  <rect x="150" y="310" width="12" height="12" fill="#82b366"/>
  <text x="168" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Primary Circuit (active)</text>
  <rect x="330" y="310" width="12" height="12" fill="#d6b656"/>
  <text x="348" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Secondary Circuit (standby)</text>

  <text x="350" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Private peering provides Layer 3 connectivity via BGP — not over public internet</text>
</svg>
