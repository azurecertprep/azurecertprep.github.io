<rect x="345" y="260" width="220" height="28" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
<text x="455.0" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#333">Publish the shared library before deploying dependent services.</text>
