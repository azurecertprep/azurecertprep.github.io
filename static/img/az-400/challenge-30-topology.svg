<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 30 - Package Dependency Architecture</title>
  <desc id="desc">Dependency graph showing the shared payments library feeding backend services and the frontend.</desc>
