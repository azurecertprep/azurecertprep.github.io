      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="658" height="328" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330.0" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Challenge 30 - Package Dependency Architecture</text>
