  <text x="604" y="194" text-anchor="middle" class="label">Models</text>
  <text x="604" y="210" text-anchor="middle" class="desc">Document AI choices</text>
  <text x="604" y="224" text-anchor="middle" class="desc">Embeddings + chat</text>
  <rect x="562" y="234" width="84" height="18" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
