<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 21 Azure AI Foundry architecture</title>
  <desc id="desc">Architecture diagram showing Azure AI Foundry organized as a hub with projects, model selections, and deployments for team workloads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .desc { font: 10px 'Segoe UI', Arial, sans-serif; fill: #333333; }
      .line { stroke: #666666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <text x="24" y="24" class="title">Challenge 21 — Azure AI Foundry architecture</text>

  <rect x="20" y="122" width="118" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="79" y="146" text-anchor="middle" class="label">AI Foundry</text>
  <text x="79" y="162" text-anchor="middle" class="desc">Unified AI platform</text>

  <path d="M138 152 H188" class="line"/>

