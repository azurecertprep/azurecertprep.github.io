  <text x="438" y="212" text-anchor="middle" class="desc">Document processing</text>
  <rect x="392" y="224" width="92" height="24" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="438" y="240" text-anchor="middle" class="desc">Evaluations</text>

  <path d="M504 90 H548" class="line"/>
  <path d="M504 216 H548" class="line"/>

  <rect x="548" y="44" width="112" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="604" y="68" text-anchor="middle" class="label">Models</text>
  <text x="604" y="84" text-anchor="middle" class="desc">GPT-4o</text>
  <text x="604" y="98" text-anchor="middle" class="desc">Phi · Llama · Mistral</text>
  <rect x="562" y="108" width="84" height="18" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
