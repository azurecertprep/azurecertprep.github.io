  <text x="438" y="86" text-anchor="middle" class="desc">Customer chatbot</text>
  <rect x="392" y="98" width="92" height="24" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="438" y="114" text-anchor="middle" class="desc">Prompt flows</text>

  <rect x="372" y="170" width="132" height="92" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
