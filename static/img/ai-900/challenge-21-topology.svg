  <text x="253" y="140" text-anchor="middle" class="label">Hub</text>
  <text x="253" y="156" text-anchor="middle" class="desc">Shared governance,</text>
  <text x="253" y="170" text-anchor="middle" class="desc">security, connections</text>

  <path d="M318 152 H372" class="line"/>

  <rect x="372" y="44" width="132" height="92" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
