<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 12 OCR Read result structure</title>
  <desc id="desc">Hierarchy diagram showing Read Result containing pages, pages containing lines, and lines containing words with confidence and bounding polygons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .label { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .desc { font: 10px 'Segoe UI', Arial, sans-serif; fill: #333333; }
      .line { stroke: #666666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <text x="24" y="24" class="title">Challenge 12 — OCR Read result hierarchy</text>

  <rect x="20" y="102" width="110" height="54" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="75" y="126" text-anchor="middle" class="label">Read Result</text>
  <text x="75" y="142" text-anchor="middle" class="desc">Root response object</text>

  <path d="M130 129 H180" class="line"/>

  <rect x="180" y="64" width="110" height="54" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="235" y="88" text-anchor="middle" class="label">Page 1</text>
  <text x="235" y="104" text-anchor="middle" class="desc">Text + layout info</text>

  <rect x="180" y="140" width="110" height="54" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="235" y="164" text-anchor="middle" class="label">Page 2</text>
  <text x="235" y="180" text-anchor="middle" class="desc">Optional next page</text>

  <path d="M290 91 H340" class="line"/>

  <rect x="340" y="40" width="160" height="46" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="420" y="59" text-anchor="middle" class="label">Line 1</text>
  <text x="420" y="73" text-anchor="middle" class="desc">Invoice #12345</text>

  <rect x="340" y="98" width="160" height="46" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="420" y="117" text-anchor="middle" class="label">Line 2</text>
  <text x="420" y="131" text-anchor="middle" class="desc">Date: January 15, 2024</text>

  <rect x="340" y="156" width="160" height="38" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="420" y="179" text-anchor="middle" class="label">...</text>

  <path d="M500 63 H540" class="line"/>
  <path d="M500 121 H540" class="line"/>

  <rect x="540" y="34" width="110" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="595" y="53" text-anchor="middle" class="label">Invoice</text>
  <rect x="540" y="70" width="110" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="595" y="89" text-anchor="middle" class="label">#12345</text>
  <rect x="540" y="110" width="110" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="595" y="129" text-anchor="middle" class="label">Date:</text>
  <rect x="540" y="146" width="110" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="595" y="165" text-anchor="middle" class="label">January</text>
  <rect x="540" y="182" width="110" height="30" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="595" y="201" text-anchor="middle" class="label">...</text>

  <text x="595" y="231" text-anchor="middle" class="desc">Each word includes confidence + bounding polygon</text>
</svg>