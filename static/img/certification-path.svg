<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Segoe UI, Arial, sans-serif">
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" 
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- AZ-900 (Success/positive - entry point) -->
  <rect x="40" y="140" width="160" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="120" y="170" text-anchor="middle" font-weight="bold" font-size="14" fill="#1b5e20">AZ-900</text>
  <text x="120" y="190" text-anchor="middle" font-size="12" fill="#555">Fundamentals</text>

  <!-- AZ-104 (Primary - hub) -->
  <rect x="290" y="140" width="160" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="370" y="170" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">AZ-104</text>
  <text x="370" y="190" text-anchor="middle" font-size="12" fill="#555">Administrator</text>

  <!-- AZ-305 (Accent/services) -->
  <rect x="560" y="30" width="180" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="650" y="60" text-anchor="middle" font-weight="bold" font-size="14" fill="#4a235a">AZ-305</text>
  <text x="650" y="80" text-anchor="middle" font-size="12" fill="#555">Solutions Architect</text>

  <!-- AZ-400 (Accent/services) -->
  <rect x="560" y="140" width="180" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="650" y="170" text-anchor="middle" font-weight="bold" font-size="14" fill="#4a235a">AZ-400</text>
  <text x="650" y="190" text-anchor="middle" font-size="12" fill="#555">DevOps Engineer</text>

  <!-- SC-500 (Accent/services) -->
  <rect x="560" y="250" width="180" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="650" y="280" text-anchor="middle" font-weight="bold" font-size="14" fill="#4a235a">SC-500</text>
  <text x="650" y="300" text-anchor="middle" font-size="12" fill="#555">Security Engineer</text>

  <!-- Arrow AZ-900 → AZ-104 -->
  <line x1="200" y1="175" x2="285" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow AZ-104 → AZ-305 -->
  <path d="M450,155 C500,155 510,65 555,65" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow AZ-104 → AZ-400 -->
  <line x1="450" y1="175" x2="555" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow AZ-104 → SC-500 -->
  <path d="M450,195 C500,195 510,285 555,285" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
