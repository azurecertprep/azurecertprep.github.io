<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 08 - Management Group Structure</title>
  <desc id="desc">A tenant root group branching into production, development, and sandbox management groups with subscriptions and resource groups beneath them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <text x="220" y="22" class="title">Enterprise Management Group Structure</text>
  <rect x="220" y="32" width="240" height="48" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="282" y="60" class="label">Tenant Root Group</text>

  <line x1="340" y1="80" x2="340" y2="96" class="line"/>
  <line x1="120" y1="96" x2="560" y2="96" class="line"/>
  <line x1="120" y1="96" x2="120" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="340" y1="96" x2="340" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="560" y1="96" x2="560" y2="108" class="line" marker-end="url(#arrow)"/>

  <rect x="20" y="112" width="200" height="228" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="84" y="136" class="label">Production</text>
  <text x="50" y="152" class="desc">Management group for live workloads</text>
  <rect x="40" y="170" width="160" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="86" y="194" class="label">Subscription: Prod-East</text>
  <rect x="52" y="206" width="64" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="61" y="219" class="desc">rg-web-prod</text>
  <rect x="122" y="206" width="66" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="130" y="219" class="desc">rg-data-prod</text>
  <rect x="40" y="248" width="160" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="85" y="272" class="label">Subscription: Prod-West</text>
  <rect x="84" y="281" width="72" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="94" y="294" class="desc">rg-app-prod</text>

  <rect x="240" y="112" width="200" height="228" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="298" y="136" class="label">Development</text>
  <text x="275" y="152" class="desc">Separate branch for engineering teams</text>
  <rect x="260" y="170" width="160" height="84" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="312" y="194" class="label">Subscription: Dev-Team</text>
  <rect x="275" y="208" width="64" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="285" y="221" class="desc">rg-web-dev</text>
  <rect x="345" y="208" width="68" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="353" y="221" class="desc">rg-data-dev</text>

  <rect x="460" y="112" width="200" height="228" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="529" y="136" class="label">Sandbox</text>
  <text x="500" y="152" class="desc">Low-risk experimentation and labs</text>
  <rect x="480" y="170" width="160" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="494" y="194" class="label">Subscription: Individual-Testing</text>
  <rect x="533" y="206" width="56" height="20" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="544" y="219" class="desc">rg-lab</text>
</svg>