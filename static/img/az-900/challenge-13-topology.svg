<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 13 - Storage Account Structure</title>
  <desc id="desc">A storage account containing blob containers for images, backups, and logs, each holding individual blobs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <rect x="20" y="20" width="620" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="40" y="48" class="title">Storage Account: mystorageaccount</text>
  <text x="40" y="66" class="desc">Blob containers organize unstructured data such as media, backups, and application logs.</text>

  <line x1="330" y1="78" x2="330" y2="96" class="line"/>
  <line x1="130" y1="96" x2="530" y2="96" class="line"/>
  <line x1="130" y1="96" x2="130" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="330" y1="96" x2="330" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="530" y1="96" x2="530" y2="108" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="180" height="180" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="87" y="138" class="label">Container: images</text>
  <rect x="58" y="156" width="144" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="101" y="175" class="desc">photo1.jpg</text>
  <rect x="58" y="196" width="144" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="101" y="215" class="desc">photo2.png</text>

  <rect x="240" y="112" width="180" height="180" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="283" y="138" class="label">Container: backups</text>
  <rect x="258" y="168" width="144" height="30" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="286" y="187" class="desc">db-backup-2024.bak</text>

  <rect x="440" y="112" width="180" height="180" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="494" y="138" class="label">Container: logs</text>
  <rect x="458" y="168" width="144" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="496" y="187" class="desc">app-log-01.txt</text>
</svg>