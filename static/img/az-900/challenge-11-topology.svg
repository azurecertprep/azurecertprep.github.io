<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 11 - Virtual Network Topology</title>
  <desc id="desc">A virtual network using the 10.0.0.0/16 address space with separate web, app, and database subnets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <rect x="20" y="20" width="620" height="210" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="40" y="48" class="title">Virtual Network: 10.0.0.0/16</text>
  <text x="40" y="66" class="desc">65,536 addresses are segmented into dedicated subnets for each application tier.</text>

  <line x1="330" y1="78" x2="330" y2="96" class="line"/>
  <line x1="130" y1="96" x2="530" y2="96" class="line"/>
  <line x1="130" y1="96" x2="130" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="330" y1="96" x2="330" y2="108" class="line" marker-end="url(#arrow)"/>
  <line x1="530" y1="96" x2="530" y2="108" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="180" height="88" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="92" y="138" class="label">web-subnet</text>
  <text x="86" y="158" class="desc">CIDR: 10.0.1.0/24</text>
  <text x="72" y="174" class="desc">251 usable addresses</text>
  <rect x="72" y="176" width="116" height="18" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="96" y="188" class="desc">Web tier</text>

  <rect x="240" y="112" width="180" height="88" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="294" y="138" class="label">app-subnet</text>
  <text x="286" y="158" class="desc">CIDR: 10.0.2.0/24</text>
  <text x="272" y="174" class="desc">251 usable addresses</text>
  <rect x="272" y="176" width="116" height="18" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="292" y="188" class="desc">App tier</text>

  <rect x="440" y="112" width="180" height="88" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="496" y="138" class="label">db-subnet</text>
  <text x="486" y="158" class="desc">CIDR: 10.0.3.0/24</text>
  <text x="472" y="174" class="desc">251 usable addresses</text>
  <rect x="472" y="176" width="116" height="18" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="488" y="188" class="desc">Data tier</text>
</svg>