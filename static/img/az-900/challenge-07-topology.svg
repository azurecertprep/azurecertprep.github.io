<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 07 - Azure Regions and Availability Zones</title>
  <desc id="desc">An Azure region in East US containing three availability zones, each backed by an independent datacenter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <rect x="20" y="20" width="620" height="210" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="40" y="48" class="title">Azure Region: East US</text>
  <text x="40" y="66" class="desc">Availability Zones provide high availability by using separate physical datacenters.</text>

  <line x1="330" y1="78" x2="330" y2="96" class="line" marker-end="url(#arrow)"/>
  <line x1="130" y1="96" x2="130" y2="80" class="line"/>
  <line x1="330" y1="96" x2="130" y2="96" class="line"/>
  <line x1="330" y1="96" x2="330" y2="80" class="line"/>
  <line x1="330" y1="96" x2="530" y2="96" class="line"/>
  <line x1="530" y1="96" x2="530" y2="80" class="line"/>

  <rect x="45" y="100" width="170" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="60" y="128" class="label">Availability Zone 1</text>
  <text x="60" y="144" class="desc">Independent power, cooling,</text>
  <text x="60" y="157" class="desc">and networking infrastructure</text>
  <rect x="68" y="165" width="124" height="22" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="92" y="180" class="desc">Datacenter A</text>

  <rect x="245" y="100" width="170" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="260" y="128" class="label">Availability Zone 2</text>
  <text x="260" y="144" class="desc">Independent power, cooling,</text>
  <text x="260" y="157" class="desc">and networking infrastructure</text>
  <rect x="268" y="165" width="124" height="22" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="292" y="180" class="desc">Datacenter B</text>

  <rect x="445" y="100" width="170" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="460" y="128" class="label">Availability Zone 3</text>
  <text x="460" y="144" class="desc">Independent power, cooling,</text>
  <text x="460" y="157" class="desc">and networking infrastructure</text>
  <rect x="468" y="165" width="124" height="22" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="492" y="180" class="desc">Datacenter C</text>
</svg>