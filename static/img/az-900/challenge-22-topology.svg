<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 22 - Azure Resource Manager Architecture</title>
  <desc id="desc">Azure Portal, CLI, PowerShell, and REST API send management requests through Azure Resource Manager, which then provisions and manages Azure services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <text x="185" y="24" class="title">Azure Resource Manager Architecture</text>

  <rect x="20" y="40" width="170" height="220" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="62" y="66" class="label">Management Tools</text>
  <rect x="42" y="82" width="126" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="78" y="101" class="desc">Azure Portal</text>
  <rect x="42" y="124" width="126" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="92" y="143" class="desc">Azure CLI</text>
  <rect x="42" y="166" width="126" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="85" y="185" class="desc">PowerShell</text>
  <rect x="42" y="208" width="126" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="92" y="227" class="desc">REST API</text>

  <rect x="250" y="100" width="180" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="292" y="130" class="label">Azure Resource</text>
  <text x="321" y="145" class="label">Manager</text>
  <text x="291" y="168" class="desc">Consistent control plane</text>
  <text x="280" y="183" class="desc">for deployment and governance</text>

  <rect x="500" y="40" width="160" height="220" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="545" y="66" class="label">Azure Services</text>
  <rect x="520" y="88" width="120" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="552" y="107" class="desc">Virtual Machines</text>
  <rect x="520" y="128" width="120" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="559" y="147" class="desc">Storage</text>
  <rect x="520" y="168" width="120" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="572" y="187" class="desc">SQL</text>
  <rect x="520" y="208" width="120" height="30" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="550" y="227" class="desc">App Service</text>

  <line x1="168" y1="98" x2="250" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="168" y1="140" x2="250" y2="140" class="line" marker-end="url(#arrow)"/>
  <line x1="168" y1="182" x2="250" y2="160" class="line" marker-end="url(#arrow)"/>
  <line x1="168" y1="224" x2="250" y2="180" class="line" marker-end="url(#arrow)"/>
  <line x1="430" y1="150" x2="500" y2="150" class="line" marker-end="url(#arrow)"/>
</svg>