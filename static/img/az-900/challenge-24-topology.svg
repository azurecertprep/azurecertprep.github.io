<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc">
  <title id="title">Challenge 24 - Azure Monitor Architecture</title>
  <desc id="desc">Data sources feed Azure Monitor, which organizes telemetry into metrics and logs and drives dashboards, alerts, autoscale, and analytics actions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1f1f1f; }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1f1f1f; }
    .desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #333333; }
    .line { stroke: #666666; stroke-width: 2; fill: none; }
  </style>

  <text x="215" y="24" class="title">Azure Monitor Architecture</text>

  <rect x="20" y="40" width="180" height="250" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="73" y="66" class="label">Data Sources</text>
  <rect x="40" y="86" width="140" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="82" y="105" class="desc">Applications</text>
  <rect x="40" y="128" width="140" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="78" y="147" class="desc">VMs / Containers</text>
  <rect x="40" y="170" width="140" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="94" y="189" class="desc">Networks</text>
  <rect x="40" y="212" width="140" height="32" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="85" y="231" class="desc">Custom Sources</text>

  <rect x="240" y="40" width="200" height="250" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="301" y="66" class="label">Azure Monitor</text>
  <rect x="260" y="96" width="160" height="74" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="316" y="122" class="label">Metrics</text>
  <text x="293" y="140" class="desc">Numerical time-series data</text>
  <text x="304" y="154" class="desc">for dashboards and alerts</text>
  <rect x="260" y="186" width="160" height="74" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="327" y="212" class="label">Logs</text>
  <text x="290" y="230" class="desc">Detailed operational records</text>
  <text x="303" y="244" class="desc">for analysis and retention</text>

  <rect x="480" y="40" width="180" height="250" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="540" y="66" class="label">Actions</text>
  <rect x="500" y="82" width="140" height="26" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="548" y="99" class="desc">Dashboards</text>
  <rect x="500" y="116" width="140" height="26" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="557" y="133" class="desc">Alerts</text>
  <rect x="500" y="150" width="140" height="26" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="548" y="167" class="desc">Autoscale</text>
  <rect x="500" y="198" width="140" height="26" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="545" y="215" class="desc">Log Analytics</text>
  <rect x="500" y="232" width="140" height="26" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="554" y="249" class="desc">Workbooks</text>
  <rect x="500" y="264" width="140" height="26" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="564" y="281" class="desc">Export</text>

  <line x1="180" y1="102" x2="240" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="180" y1="144" x2="240" y2="144" class="line" marker-end="url(#arrow)"/>
  <line x1="180" y1="186" x2="240" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="180" y1="228" x2="240" y2="234" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="126" x2="500" y2="95" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="133" x2="500" y2="129" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="140" x2="500" y2="163" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="220" x2="500" y2="211" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="228" x2="500" y2="245" class="line" marker-end="url(#arrow)"/>
  <line x1="420" y1="236" x2="500" y2="277" class="line" marker-end="url(#arrow)"/>
</svg>