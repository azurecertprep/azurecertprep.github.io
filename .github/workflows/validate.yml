name: Validate Content

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website (checks broken links)
        run: npm run build

      - name: Check for broken internal links
        run: |
          echo "✅ Build succeeded — no broken links found"
